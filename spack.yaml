spack:
  include:
  - include.yaml
  definitions:
  - current_compiler_gcc:
    - gcc
  - current_compiler_llvm:
    - llvm
  - ai_pillars_llvmbased:
    - py-jaxlib  
  - ai_pillars_outofmatrix:
    - py-dask
    - py-jax
  - ai_pillars_inmatrix:
    - py-ray
    - py-torch
  - ai_secondary_outofmatrix:
    - py-click
    - py-cloudpickle
    - py-cryptography
    - py-fsspec
    - py-ipykernel
    - py-joblib
    - py-jsonlines
    - py-jupyterlab
    - py-mlflow
    - py-notebook
    - py-omegaconf
    - py-prometheus-client
    - py-pytest
    - py-python-dotenv
    - py-pytorch-lightning
    - py-tensorboard
    - py-threadpoolctl
    - py-torchmetrics
    - py-typer
    - py-urllib3
    - py-uvicorn
    - py-wandb
    - py-xgboost
  - ai_secondary:
    #- py-h5py
    #- py-matplotlib
    - py-msgpack
    #- py-numpy
    # - py-orjson
    #- py-pandas
    #- py-scikit-learn
    #- py-scipy
    - py-torchaudio
    - py-torchvision
  - all_gcc:
    - $ai_pillars_inmatrix
    - $ai_secondary
  - all_llvm:
    - $ai_pillars_llvmbased
  - out_of_matrix:
    - $ai_pillars_outofmatrix_llvmbased
    - $ai_pillars_outofmatrix
    #- $ai_secondary_outofmatrix
  specs:
  - matrix:
    - - $all_gcc
    - - $%current_compiler_gcc
  - matrix: 
    - - $all_llvm
    - - $%current_compiler_llvm
  - $out_of_matrix
  view: false

