spack:
  concretizer:
    unify: true
    reuse: true
  packages:
    all:
      require: target=icelake
      variants:
      - +cuda
      - cuda_arch=90
  modules:
    default:
      enable: []
  definitions:
  - current_compiler:
    - gcc@11.5.0 +bootstrap -nvptx
  - gcc_compiler:
    - gcc@15.2.0 -bootstrap +nvptx
  - zlib-api:
    - zlib-ng  
  - othertools:
    - binutils +ld +gas -gold
    - git
    - perl
    - patchelf
    - guile
    - sqlite
  - utils:
    - libtool
    - bison
    - diffutils
    - pkgconf
  - assemblers:
    - nasm
    - yasm
  - autotools:
    - automake
    - m4
    - texinfo
    - gmake
  - cmaketools:
    - cmake
    - ninja
  - common_tools:
    - python
    - emacs
    - curl
    - gdbm    
  - system_externals:
    - knem
    - hwloc
    - libevent
    - lustre
    - openssl
    - rdma-core
    - slurm
  - cuda_compiler:
    - cuda@12.6.0+compat+cupti+samples~full 
  - all: 
    - $autotools
    - $cmaketools
    - $othertools
    - $utils
    - $assemblers
    - $common_tools  
    - $gcc_compiler
    - $zlib-ng
  - out_of_matrix:
    - $system_externals
    - $cuda_compiler
  specs:
  - matrix:
    - - $all
    - - $%current_compiler
  - $out_of_matrix
  view: false

