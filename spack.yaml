spack:
  include:
  - include.yaml
  definitions:
  - current_compiler:
    - 'gcc'
  - cuda_compiler:
    - cuda   
  - openssl:
    - 'openssl@3.2.2 build_system=generic certs=mozilla ~docs +shared'
  - zlib-api:
    - zlib-ng
  - libraries:
    - boost +container
    - hdf5 +cxx -mpi -threadsafe
    - metis
    - netcdf-c -mpi
    - netcdf-fortran
    - libszip
    - cgal  
    - libmatheval
    - cfitsio
  - profilers:
    - hpctoolkit
  - tools:
    - proj
    - gdal +python
    - gmt +ffmpeg  ^json-c +ipo
    - cdo
    - eccodes
  - blitz:
    - blitz
  - applications_gromacs:
    - gromacs ~mpi+openmp~plumed
    - gsl +external-cblas
  - applications_namd:
    - namd +single_node_gpu interface=tcl
    - charmpp backend=multicore build-target=charm++
  - libraries_specific:
    - openblas  -ilp64 threads=openmp
    - fftw -mpi
  - gpu_no_bin:
    - cutensor
  - gpu_bin:
    - libxc ~cuda
    - nccl   
  - all:
    - $libraries
    - $tools
    - $blitz
    - $applications_gromacs
    - $applications_namd
    - $libraries_specific
    - $gpu_bin
  - out_of_matrix:
    - $cuda_compiler
    - $openssl
    - $zlib-api
    - $gpu_no_bin
  specs:
  - matrix:
    - - $all
    - - $%current_compiler
  - $out_of_matrix
  view: false

