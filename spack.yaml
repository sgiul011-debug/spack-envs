spack:
  include:
  - include.yaml
  definitions:
  - current_compiler:
    - 'gcc'
  #- cuda_compiler:
  #  - cuda   
  #- openssl:
  # - 'openssl@3.2.2 build_system=generic certs=mozilla ~docs +shared'
  #- zlib-api:
  #  - zlib-ng
  - libraries:
    - boost 
    - hdf5 
    - metis
    - netcdf-c 
    - netcdf-fortran
    - libszip
    - cgal  
    - libmatheval
    - cfitsio
  - profilers:
    - hpctoolkit
  - tools:
    - proj
    - gdal 
    - gmt 
    - cdo
    - eccodes
  - blitz:
    - blitz
  - applications_gromacs:
    - gromacs 
    - gsl 
  - applications_namd:
    - namd 
    - charmpp 
  - libraries_specific:
    - openblas  
    - fftw 
  - gpu_no_bin:
    - cutensor
  - gpu_bin:
    - libxc 
    - nccl   
  - all:
    - $libraries
    - $tools
    - $blitz
    - $applications_gromacs
    - $applications_namd
    - $libraries_specific
    - $gpu_bin
  - out_of_matrix:
    #- $cuda_compiler
    #- $openssl
    #- $zlib-api
    - $gpu_no_bin
  specs:
  - matrix:
    - - $all
    - - $%current_compiler
  - $out_of_matrix
  view: false

