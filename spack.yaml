spack:
  include:
  - include.yaml
  definitions:
  - external:
    - ucc
    - ucx
    #- hwloc
    #- pmix
  - current_compiler:
    #- 'gcc@15.2.0 ~bootstrap+nvptx'
    - gcc
  #- openssl:
  #  - 'openssl@3.2.2 build_system=generic certs=mozilla ~docs +shared'
  #- cuda:
  #  - cuda@13.0.2
  #- zlib-api:
  #  - zlib-ng
  - libraries:
      - adios
      - boost 
      - hdf5  
      - netcdf-c 
      - netcdf-fortran
      - parallel-netcdf
      - metis 
      - parmetis  
      - py-mpi4py
      - cgal 
  - benchmarks:
    - osu-micro-benchmarks 
  - libraries_petsc:
    - petsc 
  - applications_gromacs:
    - gsl 
    - plumed
    - gromacs
  - applications_namd:
    - namd
    - charmpp 
  - applications_cp2k:
    - cp2k
  - applications_nwchem:
    - nwchem
  - applications_nco:
    - nco
  - libraries_specific:
    - openmpi
    - netlib-scalapack
    - openblas  
    - fftw 
  - gpu:
    - elpa
    - slate
    - slepc
  - tools_esmf:
    - parallelio 
    - esmf 
  - applications_lammps:
    - lammps 
    - kokkos 
    - kokkos-nvcc-wrapper 
    - voropp
  - papi_tools:
    - papi
    - bc
    - ed
  - out_of_matrix:
    #- $openssl
    #- $cuda
    #- $zlib-api
    - $external
  - all:
    - $libraries
    - $libraries_petsc
    - $benchmarks
    - $applications_gromacs
    - $applications_nwchem
    - $applications_namd
    - $applications_lammps
    - $applications_nco
    - $libraries_specific
    - $gpu
    - $tools_esmf
    - $papi_tools
    - $applications_cp2k
  specs:
  - matrix:
    - - $all
    - - $%current_compiler
  - $out_of_matrix
  view: false

