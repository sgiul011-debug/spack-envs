spack:
  include:
  - packages.yaml
  - concretizer.yaml
  definitions:
  - current_compiler:
    - gcc@11.5.0 +bootstrap -nvptx
  - openssl:
    - 'openssl@3.2.2 build_system=generic certs=mozilla ~docs +shared'
  - cuda:
    - cuda@13.0.2 +compat+cupti+samples~full samples_arch=90
  - zlib-api:
    - zlib-ng
  - ba_requirements:
    - tcl
    - environment-modules
  - cmake_tools:
    - cmake 
  - python_tools:
    - python@3.14
  - compilers:
    - intel-oneapi-compilers-classic
    - llvm@21.1.4 +clang +flang ~cuda ~offload ~libomptarget %c,cxx=gcc
  - binary_libraries:
    - intel-oneapi-mkl~cluster
    - nag-library@27
  - java_tools:
    - maven
  - transfer_tools:
    - ncftp
  - singularity_tools:
    - singularityce
  - testing_tools:
    - jube
    - py-ruamel-yaml
    - snakemake
  - applications_star-ccm-plus:
    - star-ccm-plus
  - tools_idl:
    - idl@8.5
