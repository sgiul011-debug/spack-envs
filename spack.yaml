spack:
  concretizer:
    unify: true
    reuse: true
  packages:
    all:
      require: target=icelake
      variants:
      - +cuda
      - cuda_arch=90
  modules:
    default:
      enable: []
  definitions:
  - current_compiler:
    - gcc@11.5.0 +bootstrap -nvptx
  - gcc_compiler:
    - gcc@13.4.0 -bootstrap +nvptx
  - othertools:
    - binutils +ld +gas -gold
    - git
    - perl
    - patchelf
    - guile
    - sqlite
  - utils:
    - libtool
    - bison
    - diffutils
    - pkgconf
  - assemblers:
    - nasm
    - yasm
  - autotools:
    - automake
    - m4
    - texinfo
    - gmake
  - cmaketools:
    - cmake
    - ninja
  - common_tools:
    - python
    - emacs
    - curl
    - gdbm    
  - all: 
    - $autotools
    - $cmaketools
    - $othertools
    - $utils
    - $assemblers
    - $common_tools  
    - $gcc_compiler
  - out_of_matrix:
    - $cuda_compiler
  specs:
  - matrix:
    - - $all
    - - $%current_compiler
  - $out_of_matrix
  view: false

