spack:
  include:
  - include.yaml
  definitions:
  - current_compiler:
    - gcc
  - system_externals:
    - knem
    - pmix
    - hwloc
    - libevent
    - lustre
    - openssl
    - rdma-core
    - slurm  
  - zlib-api:
    - zlib-ng  
  - othertools:
    - binutils 
    - git
    - perl
    - patchelf
    - guile
    - sqlite
  - utils:
    - libtool
    - bison
    - diffutils
    - pkgconf
  - assemblers:
    - nasm
    - yasm
  - autotools:
    - automake
    - m4
    - texinfo
    - gmake
  - cmaketools:
    - cmake
    - ninja
  - common_tools:
    - python
    - emacs
    - curl
    - gdbm    
  - intel_libraries:
    - intel-oneapi-ipp
    - intel-oneapi-tbb
    - intel-oneapi-mkl
    - intel-oneapi-mpi
    - intel-oneapi-inspector
    - intel-oneapi-advisor
    - intel-oneapi-itac
    - intel-oneapi-vtune
  - gcc_compiler:
    - gcc
  - intel-oneapi-compilers:
    - intel-oneapi-compilers
  - nvhpc_compiler:
    - nvhpc
  - cuda_compiler:
    - cuda
  - aocc_compiler:
    - aocc 
  - all: 
    - $autotools
    - $cmaketools
    - $othertools
    - $utils
    - $assemblers
    - $common_tools  
    - $gcc_compiler
    - $zlib-api
  - out_of_matrix:
    - $system_externals
    - $cuda_compiler
    - $intel-oneapi-compilers
    - $nvhpc_compiler
    - $aocc_compiler
    - $internal_libraries
  specs:
  - matrix:
    - - $all
    - - $%current_compiler
  - $out_of_matrix
  view: false

