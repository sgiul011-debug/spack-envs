spack:
  include:
  - include.yaml
  definitions:  
  - current_compiler:
    - gcc
  - advanced_gcc_compiler:
    - gcc
  - intel-oneapi-compilers:
    - intel-oneapi-compilers
  - nvhpc_compiler:
    - nvhpc
  - all: 
    - $advanced_gcc_compiler
  - out_of_matrix:
    - $intel-oneapi-compilers
    - $nvhpc_compiler
  specs:
  - matrix:
    - - $all
    - - $%current_compiler
  - $out_of_matrix
  view: false

